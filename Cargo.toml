[package]
name = "shoehorn"
version = "0.1.0"
edition = "2024"
description = "Quantize a BF16 GGUF with an imatrix to exactly fit your Mac's VRAM, then run it with llama.cpp"
license = "MIT"
repository = "https://github.com/notactuallytreyanastasio/shoehorn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
half = "2.7.1"
indicatif = { version = "0.18.6", features = ["rayon"] }
memmap2 = "0.9.11"
metal = "0.33.0"
rayon = "1.12.0"
serde_json = "1.0.151"
