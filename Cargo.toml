[package]
name = "shoehorn"
version = "0.2.0"
edition = "2024"
description = "Quantize a BF16 GGUF with an imatrix to exactly fit your VRAM, then run it with llama.cpp"
license = "MIT"
repository = "https://github.com/notactuallytreyanastasio/shoehorn"
readme = "README.md"
keywords = ["gguf", "llm", "quantization", "llama-cpp", "imatrix"]
categories = ["command-line-utilities", "science"]
# keep local model files (testdata/) and web assets out of the crate package
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
half = "2.7.1"
indicatif = { version = "0.18.6", features = ["rayon"] }
memmap2 = "0.9.11"
rayon = "1.12.0"
serde_json = "1.0.151"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = "0.12.1"
