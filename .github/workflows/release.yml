name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf shoehorn-${{ github.ref_name }}-${{ matrix.target }}.tar.gz shoehorn
      - name: package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/shoehorn.exe -DestinationPath shoehorn-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: shoehorn-*
          generate_release_notes: true
